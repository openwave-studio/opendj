name: CI

# Pull requests run the Linux checks (format, clippy, tests), the dependency
# check, and the macOS app build so each pull request can be tried on a Mac.
# The Windows checks and the Windows app build run after a merge to main, or
# for any branch from the Actions tab (Run workflow).
# A merge queue (merge_group) would run the same Linux checks and the
# dependency check on the pull request rebased on the latest main, skipping
# the app builds, which run again after the merge. GitHub offers merge
# queues only to repositories owned by an organization, so this waits for
# that.
# Releases build every platform in release.yml.
on:
  push:
    branches: [main]
    paths-ignore: ["website/**", "docs/**", "openspec/**", "**/*.md"]
  pull_request:
  merge_group:
  workflow_dispatch:

# A new push to a pull request cancels the run for the push before it.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    # Pull requests that only touch docs skip the checks below. Skipping them
    # here instead of with paths-ignore lets them report as passed, so a
    # docs-only pull request isn't left waiting on required checks.
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ (github.event_name != 'pull_request' && github.event_name != 'merge_group') || steps.filter.outputs.code == 'true' }}
    steps:
      # The merge queue has no pull request to ask for its files, so it
      # compares the queued commit with the main it was rebased on.
      - uses: actions/checkout@v7
        if: github.event_name == 'merge_group'
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        with:
          base: ${{ github.event.merge_group.base_sha }}
          predicate-quantifier: every
          filters: |
            code:
              - "**"
              - "!website/**"
              - "!docs/**"
              - "!openspec/**"
              - "!**/*.md"

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    env:
      # Line tables are enough for test backtraces and keep rustc's memory
      # and the cache smaller than full debug info.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        # mesa-vulkan-drivers provides lavapipe, a software Vulkan driver, so the
        # waveform shader test runs on CI machines without a GPU. cmake and
        # libclang build Ableton Link.
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libasound2-dev libudev-dev mesa-vulkan-drivers cmake libclang-dev
      - name: Add swap
        # Building the app's tests needs about 16.5 GB, more than the
        # runner's 16 GB (its Slint UI is one generated module of over
        # 800,000 lines). The rest goes to swap.
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
      - name: Memory fence for the app build
        # Left alone, rustc pushes the runner's own agent out to swap too,
        # the agent stops answering, and the job fails with "The hosted
        # runner lost communication with the server". The app steps below
        # run in this cgroup: past 12 GB the kernel swaps rustc's own pages
        # and leaves the rest of the runner's memory alone.
        run: |
          echo +memory | sudo tee /sys/fs/cgroup/cgroup.subtree_control
          sudo mkdir -p /sys/fs/cgroup/app-build
          echo 12G | sudo tee /sys/fs/cgroup/app-build/memory.max
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - name: Karaoke web page regression tests
        run: node --test crates/remote/tests/*.test.cjs
      - run: cargo clippy --workspace --exclude opendj --all-targets -- -D warnings
      # Checking the app takes several GB per target (its Slint UI is one
      # large generated module): its binary and tests one at a time, so the
      # runner doesn't run out of memory.
      - name: cargo clippy -p opendj --all-targets -j1
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/app-build/cgroup.procs
          cargo clippy -p opendj --all-targets -j1 -- -D warnings
      - run: cargo test --workspace --exclude opendj
      # Pure Data patches in the plugin helper (experimental, off by default):
      # libpd builds from source with CMake.
      - run: cargo clippy -p opendj-plugin-host --features pd --all-targets -- -D warnings
      - run: cargo test -p opendj-plugin-host --features pd
      # Compiling the app's tests takes about 16.5 GB on its own (rust-cache
      # turns incremental builds off), so it runs alone and inside the
      # memory fence. The app's test binary is the last thing this step
      # builds.
      # Includes the check that website/docs/supported-controls.txt matches
      # `opendj --list-controls` (control_list_tests in crates/app).
      - name: cargo test -p opendj
        run: |
          echo $$ | sudo tee /sys/fs/cgroup/app-build/cgroup.procs
          cargo test -p opendj
      - name: Memory used
        if: always()
        run: |
          free -h
          grep -H . /sys/fs/cgroup/app-build/memory.peak /sys/fs/cgroup/app-build/memory.events /sys/fs/cgroup/app-build/memory.swap.peak 2>/dev/null || true

  windows:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # Windows ships as a preview: the app must build and its tests pass there
    # too. windows-latest already has the cmake and LLVM that Ableton Link needs.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # cpal's ASIO support needs Steinberg's ASIO SDK. Its build script
      # downloads the SDK itself but expects the zip's old folder layout;
      # find the folder with common/ and host/pc/ and point it there.
      - name: ASIO SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\asiosdk.zip"
          $dir = "$env:RUNNER_TEMP\asiosdk"
          Invoke-WebRequest https://www.steinberg.net/asiosdk -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $common = Get-ChildItem $dir -Recurse -Directory -Filter common |
            Where-Object { Test-Path (Join-Path $_.Parent.FullName 'host\pc') } |
            Select-Object -First 1
          if (-not $common) {
            Get-ChildItem $dir -Recurse -Depth 3 | ForEach-Object FullName
            throw "No common\ next to host\pc\ in the ASIO SDK"
          }
          "CPAL_ASIO_DIR=$($common.Parent.FullName)" >> $env:GITHUB_ENV
      # The runner image version (an environment variable expressions can't read).
      - run: echo "IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV
        shell: pwsh
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A new runner image can move Visual Studio, and CMake caches in
          # target/ (whisper.cpp) would still point at the old compiler.
          key: ${{ env.IMAGE_VERSION }}
      - run: cargo clippy --workspace --exclude opendj --all-targets -- -D warnings
      # Checking the app takes several GB per target (its Slint UI is one
      # large generated module): its binary and tests one at a time, so the
      # runner doesn't run out of memory.
      - run: cargo clippy -p opendj --all-targets -j1 -- -D warnings
      # The app's tests on their own, as on Linux, so nothing else compiles
      # next to them.
      - run: cargo test --workspace --exclude opendj
      - run: cargo test -p opendj

  dependencies:
    # Known vulnerabilities in dependencies, and licences that can't ship in a
    # GPL app (see deny.toml).
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  macos-app:
    # Builds an unsigned openDJ.app for Apple Silicon and attaches it to the run,
    # so the app can be tried without installing Rust.
    needs: changes
    if: needs.changes.outputs.code == 'true' && github.event_name != 'merge_group'
    runs-on: macos-15
    # GitHub is short of Apple Silicon runners at times, and a job no runner
    # picks up within 15 minutes is cancelled ("not acquired by Runner"),
    # which failed the whole run on main. The job still shows red when it
    # fails, but no longer fails the run; release.yml builds the shipped app.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo build --release -p opendj -p opendj-plugin-host
      # The version in Cargo.toml (what the app reports in Settings), with
      # the commit as the build, so About openDJ says which build this is.
      - run: scripts/bundle-macos.sh target/release/opendj "" "test build $(git rev-parse --short HEAD)"
      - uses: actions/upload-artifact@v7
        with:
          name: opendj-macos
          path: dist/opendj-macos.zip

  windows-app:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    # The Windows setup and portable zip, attached to the run so the app can
    # be tried in a Windows VM without installing Rust.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cpal's ASIO support needs Steinberg's ASIO SDK. Its build script
      # downloads the SDK itself but expects the zip's old folder layout;
      # find the folder with common/ and host/pc/ and point it there.
      - name: ASIO SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\asiosdk.zip"
          $dir = "$env:RUNNER_TEMP\asiosdk"
          Invoke-WebRequest https://www.steinberg.net/asiosdk -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $common = Get-ChildItem $dir -Recurse -Directory -Filter common |
            Where-Object { Test-Path (Join-Path $_.Parent.FullName 'host\pc') } |
            Select-Object -First 1
          if (-not $common) {
            Get-ChildItem $dir -Recurse -Depth 3 | ForEach-Object FullName
            throw "No common\ next to host\pc\ in the ASIO SDK"
          }
          "CPAL_ASIO_DIR=$($common.Parent.FullName)" >> $env:GITHUB_ENV
      # The runner image version (an environment variable expressions can't read).
      - run: echo "IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV
        shell: pwsh
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          # A new runner image can move Visual Studio, and CMake caches in
          # target/ (whisper.cpp) would still point at the old compiler.
          key: ${{ env.IMAGE_VERSION }}
      - run: cargo build --release -p opendj -p opendj-plugin-host
      # The version in Cargo.toml, as the app reports it, so the setup and
      # Apps & features name the same version.
      - run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          scripts/bundle-windows.ps1 target/release/opendj.exe $v
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: opendj-windows
          path: |
            dist/*.zip
            dist/*-setup.exe
