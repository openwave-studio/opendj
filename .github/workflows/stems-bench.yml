name: Stems benchmark

# Times openDJ's stem separation models (crates/separation) on GitHub's Linux
# and Apple Silicon machines, and attaches the converted model files so they
# can be used with `stem-bench` elsewhere. It takes up to 90 minutes, so it
# runs only by hand from the Actions tab (pick the branch to benchmark).

on:
  workflow_dispatch:

jobs:
  models:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Convert Spleeter, fetch HTDemucs
        run: |
          pip install tensorflow-cpu numpy safetensors soundfile
          mkdir -p models work/4stems
          curl -sSfL -o work/4stems.tar.gz https://github.com/deezer/spleeter/releases/download/v1.4.0/4stems.tar.gz
          tar xzf work/4stems.tar.gz -C work/4stems
          python3 scripts/models/convert_spleeter.py work/4stems/model models/spleeter-4stems.safetensors
          curl -sSfL -o models/htdemucs.safetensors https://huggingface.co/set-soft/audio_separation/resolve/main/Demucs/htdemucs.safetensors
          pip install coremltools==9.0
          python3 scripts/models/convert_spleeter_coreml.py models/spleeter-4stems.safetensors models/spleeter-4stems.mlpackage
          python3 scripts/models/convert_htdemucs_coreml.py models/htdemucs.safetensors models/htdemucs.mlpackage
          python3 scripts/models/make_test_mix.py models/test-mix-6min.wav 360
          sha256sum models/*.safetensors | tee models/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: stem-models
          path: models/

  bench:
    needs: models
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: stem-models
          path: models
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libasound2-dev mesa-vulkan-drivers cmake libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p stem-bench
      - name: Attach the Mac build of stem-bench
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: stem-bench-macos
          path: target/release/stem-bench
      - name: Spleeter on the CPU, whole 6-minute mix
        run: target/release/stem-bench models/test-mix-6min.wav --spleeter --cpu --from 120 | tee -a bench.txt
      - name: Spleeter and HTDemucs on the GPU (Metal), whole 6-minute mix
        # Linux runners have no GPU (only a software Vulkan driver), so the
        # GPU timings come from the Mac.
        if: runner.os == 'macOS'
        continue-on-error: true
        run: target/release/stem-bench models/test-mix-6min.wav --gpu | tee -a bench.txt
      - name: Core ML gives the same Spleeter and HTDemucs results as the other paths
        # GitHub's Macs are virtual machines without the Neural Engine, so
        # Core ML falls back to the CPU or GPU there; this checks the model
        # and the Rust side, and the Neural Engine numbers come from a real Mac.
        if: runner.os == 'macOS'
        continue-on-error: true
        env:
          SPLEETER_WEIGHTS: ${{ github.workspace }}/models/spleeter-4stems.safetensors
          SPLEETER_MLPACKAGE: ${{ github.workspace }}/models/spleeter-4stems.mlpackage
          OPENDJ_MODELS: ${{ github.workspace }}/models
          HTDEMUCS_MLPACKAGE: ${{ github.workspace }}/models/htdemucs.mlpackage
        run: cargo test --release -p opendj-separation core_ml -- --ignored --nocapture | tee -a bench.txt
      - name: Spleeter through Core ML, whole 6-minute mix
        if: runner.os == 'macOS'
        continue-on-error: true
        run: target/release/stem-bench models/test-mix-6min.wav --coreml --spleeter --from 120 | tee -a bench.txt
      - name: HTDemucs through Core ML, first 2 minutes
        if: runner.os == 'macOS'
        continue-on-error: true
        run: target/release/stem-bench models/test-mix-6min.wav --coreml --htdemucs --seconds 120 | tee -a bench.txt
      - name: HTDemucs on the CPU, first minute
        continue-on-error: true
        run: target/release/stem-bench models/test-mix-6min.wav --htdemucs --cpu --seconds 60 | tee -a bench.txt
      - name: Summary
        if: always()
        run: |
          echo '### ${{ matrix.os }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat bench.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
