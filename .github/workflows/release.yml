name: Release

# Pushing a tag such as v0.1.0 builds the macOS, Linux and Windows downloads and
# publishes them as a GitHub release. On a pull request that changes the
# packaging, the same builds run without publishing.
#
# Every night, when main has new commits, the same builds replace the files of
# the "nightly" pre-release (releases/tag/nightly), so a fix can be shared
# before the next version. Run this workflow by hand on main to publish a
# nightly right away. Pre-releases never become "Latest", so the README's
# download link and the app's update check keep pointing at the last version.
#
# Every build includes Pure Data patches in the plugin helper (the `pd`
# features, experimental): libpd, cyclone, ELSE and pd-lua build from source.
#
# Versions: between releases, main's Cargo.toml says the next version with
# -dev (0.9.0-dev after 0.8.0), so builds from main read as newer than every
# release so far and the nightly is named 0.9.0-nightly.<date>.<commit>. The
# prepare PR drops -dev before the tag; right after the tag, main moves on to
# the next -dev. Patch releases come from release/X.Y branches.
on:
  push:
    tags: ["v*"]
  schedule:
    # 10:00 UTC, the middle of the night in the Americas.
    - cron: "0 10 * * *"
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/bundle-*
      - res/windows/**
      - res/macos/opendj.entitlements
  workflow_dispatch:
    inputs:
      nightly:
        description: Publish as the nightly pre-release (main only)
        type: boolean
        default: true

# A new push to a pull request cancels the packaging run for the push before it.
concurrency:
  group: release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      # The build in brackets after the version in About openDJ on macOS
      # (the app itself always reports the Cargo.toml version).
      build: ${{ steps.v.outputs.build }}
      # The version Finder shows on macOS: plain numbers for a nightly,
      # otherwise empty, which means the Cargo.toml version.
      bundle: ${{ steps.v.outputs.bundle }}
      nightly: ${{ steps.v.outputs.nightly }}
      # Nothing to do: main hasn't changed since the last nightly.
      skip: ${{ steps.v.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        env:
          NIGHTLY: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.nightly)) }}
        run: |
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # The app reports the Cargo.toml version (Settings, bug reports,
          # update checks) and the downloads are named after the tag, so a
          # tag that doesn't match would ship an app that disagrees with
          # itself and keeps offering its own release as an update.
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "${GITHUB_REF_NAME#v}" != "$cargo" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match version $cargo in Cargo.toml. Merge the prepare PR that bumps it, then tag again."
            exit 1
          fi
          if [ "$NIGHTLY" = true ]; then
            sha=$(git rev-parse --short HEAD)
            # The scheduled run skips a night without new commits on main;
            # a run by hand always builds.
            last=$(git ls-remote origin refs/tags/nightly | cut -f1)
            if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$last" = "$GITHUB_SHA" ]; then
              echo "Nightly is already at $sha."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            # Main carries the next version with a -dev suffix (e.g. 0.9.0-dev
            # after 0.8.0 ships), so a nightly is named after the release it
            # leads up to: 0.9.0-nightly.20261120.abc1234 names the downloads,
            # sorts by date for apt and dnf, and says which commit it is.
            next=${cargo%%-*}
            echo "version=$next-nightly.$(date -u +%Y%m%d).$sha" >> "$GITHUB_OUTPUT"
            echo "bundle=$next" >> "$GITHUB_OUTPUT"
            echo "build=nightly $sha" >> "$GITHUB_OUTPUT"
            echo "nightly=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=$cargo" >> "$GITHUB_OUTPUT"
            echo "build=$cargo" >> "$GITHUB_OUTPUT"
          fi

  macos:
    # One app for both Apple Silicon and Intel Macs.
    # Signed with the project's Developer ID and notarized when the secrets below
    # are set (see docs/macos-signing.md); otherwise ad-hoc signed as before.
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: macos-15
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          # Keep the build cache when signing or notarizing fails, so a re-run
          # doesn't compile everything again.
          cache-on-failure: true
      - run: |
          cargo build --release -p opendj -p opendj-plugin-host --features opendj/pd,opendj-plugin-host/pd --target aarch64-apple-darwin
          cargo build --release -p opendj -p opendj-plugin-host --features opendj/pd,opendj-plugin-host/pd --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/opendj \
            target/aarch64-apple-darwin/release/opendj \
            target/x86_64-apple-darwin/release/opendj
          lipo -create -output dist/opendj-plugin-host \
            target/aarch64-apple-darwin/release/opendj-plugin-host \
            target/x86_64-apple-darwin/release/opendj-plugin-host
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          echo "MACOS_SIGN_IDENTITY=Developer ID Application" >> "$GITHUB_ENV"
      - run: scripts/bundle-macos.sh dist/opendj "${{ needs.version.outputs.bundle }}" "${{ needs.version.outputs.build }}"
      - name: Notarize
        if: env.MACOS_SIGN_IDENTITY != '' && env.APPLE_APP_PASSWORD != ''
        run: |
          auth=(--apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID")
          # The runner can lose its network for a moment, and failing here
          # throws away a three-hour build. So upload (retrying), then wait
          # on the submission by its id, retrying a dropped connection.
          id=
          for attempt in 1 2 3; do
            if out=$(xcrun notarytool submit dist/opendj-macos.zip "${auth[@]}" --output-format json); then
              id=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])' <<<"$out") && break
            fi
            echo "::warning::Upload to the notary service failed (attempt $attempt)"
            sleep 30
          done
          [ -n "$id" ] || { echo "::error::Couldn't upload to the notary service"; exit 1; }
          echo "Submission $id"
          status=
          for attempt in 1 2 3 4 5 6; do
            xcrun notarytool wait "$id" "${auth[@]}" --timeout 45m || true
            if out=$(xcrun notarytool info "$id" "${auth[@]}" --output-format json); then
              status=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])' <<<"$out" || true)
              [ "$status" != "In Progress" ] && break
            fi
            echo "::warning::Lost track of notarization $id (attempt $attempt), checking again"
            sleep 30
          done
          if [ "$status" != Accepted ]; then
            echo "::error::Notarization $id: ${status:-no answer}"
            xcrun notarytool log "$id" "${auth[@]}" || true
            exit 1
          fi
          # Staple the ticket so the app opens offline too, then zip it again.
          # Apple's ticket server can lag or drop the connection, so retry.
          for attempt in 1 2 3 4 5; do
            xcrun stapler staple dist/openDJ.app && break
            [ "$attempt" = 5 ] && exit 1
            sleep 30
          done
          rm dist/opendj-macos.zip
          (cd dist && ditto -c -k --keepParent openDJ.app opendj-macos.zip)
      - run: |
          mv dist/opendj-macos.zip "dist/openDJ-${{ needs.version.outputs.version }}-macos.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: dist/openDJ-*-macos.zip

  linux:
    # Built on the oldest supported Ubuntu, so the binary runs on any distro
    # with glibc 2.35 or newer.
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig-dev libxkbcommon-dev libasound2-dev libudev-dev cmake libclang-dev imagemagick rpm
      - name: Add swap
        # The runner was shut down mid-build without it: compiling the app
        # (its Slint UI is one generated module of over 800,000 lines) needs
        # more than the runner's memory. As in ci.yml.
        run: |
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 16G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p opendj -p opendj-plugin-host --features opendj/pd,opendj-plugin-host/pd
      - run: scripts/bundle-linux.sh target/release/opendj "${{ needs.version.outputs.version }}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm

  windows:
    # A setup .exe (per-user, no admin) and a portable zip, for x64 PCs.
    # Unsigned until a code signing certificate is set up (docs/windows.md).
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      # cpal's ASIO support needs Steinberg's ASIO SDK. Its build script
      # downloads the SDK itself but expects the zip's old folder layout;
      # find the folder with common/ and host/pc/ and point it there.
      - name: ASIO SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\asiosdk.zip"
          $dir = "$env:RUNNER_TEMP\asiosdk"
          Invoke-WebRequest https://www.steinberg.net/asiosdk -OutFile $zip
          Expand-Archive $zip -DestinationPath $dir
          $common = Get-ChildItem $dir -Recurse -Directory -Filter common |
            Where-Object { Test-Path (Join-Path $_.Parent.FullName 'host\pc') } |
            Select-Object -First 1
          if (-not $common) {
            Get-ChildItem $dir -Recurse -Depth 3 | ForEach-Object FullName
            throw "No common\ next to host\pc\ in the ASIO SDK"
          }
          "CPAL_ASIO_DIR=$($common.Parent.FullName)" >> $env:GITHUB_ENV
      # The runner image version (an environment variable expressions can't read).
      - run: echo "IMAGE_VERSION=$env:ImageVersion" >> $env:GITHUB_ENV
        shell: pwsh
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          # A new runner image can move Visual Studio, and CMake caches in
          # target/ (whisper.cpp) would still point at the old compiler.
          key: ${{ env.IMAGE_VERSION }}
      - run: cargo build --release -p opendj -p opendj-plugin-host --features opendj/pd,opendj-plugin-host/pd
      - run: scripts/bundle-windows.ps1 target/release/opendj.exe "${{ needs.version.outputs.version }}"
        shell: pwsh
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  publish:
    if: github.ref_type == 'tag'
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          name: openDJ ${{ needs.version.outputs.version }}
          body_path: docs/release-notes.md
          # Adds the list of merged pull requests (grouped by .github/release.yml)
          # under the hand-written notes.
          generate_release_notes: true
          # A tag such as v0.2.0-beta.1 makes a pre-release, for testers;
          # the README's download link skips those.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: dist/*

  nightly:
    # Replaces the "nightly" pre-release with this build: the tag moves to
    # this commit, then the old release is deleted and made again, so the
    # page only ever holds one set of downloads.
    if: needs.version.outputs.nightly == 'true' && needs.version.outputs.skip != 'true'
    needs: [version, macos, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        run: |
          stable=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          {
            echo "Built every night from \`main\` when it has new commits: the newest fixes and features, before they're in a release. Not as well tested as a release."
            echo
            echo "**Version:** $VERSION (commit $GITHUB_SHA, $(date -u '+%Y-%m-%d %H:%M UTC'))"
            if [ -n "$stable" ]; then
              echo
              echo "**Changes since $stable:** https://github.com/$GITHUB_REPOSITORY/compare/$stable...$GITHUB_SHA"
            fi
            echo
            echo "The app's update check only offers releases, so install a newer nightly by downloading it again from this page."
          } > notes.md
          # Move the tag before touching the release, so a refused push
          # leaves the last nightly up. The job's token has no workflows
          # permission, so GitHub refuses a tag on a commit whose
          # .github/workflows differ from main's: when main changes them
          # during the build, this night is skipped and the next run
          # publishes.
          if ! git push --force origin "$GITHUB_SHA:refs/tags/nightly"; then
            echo "::error::GitHub refused to move the nightly tag to $GITHUB_SHA (likely main's workflow files changed since this commit). The last nightly is still up; run the workflow again on main."
            exit 1
          fi
          gh release delete nightly --yes 2>/dev/null || true
          gh release create nightly dist/* \
            --verify-tag \
            --title "openDJ ${VERSION%%-*} nightly ($VERSION)" \
            --notes-file notes.md \
            --prerelease --latest=false
