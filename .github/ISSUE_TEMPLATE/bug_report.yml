name: Report a problem
description: Something broke, crashed or didn't do what you expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: And what did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we make it happen?
      description: The steps, as far as you know them. "It happens sometimes" is fine too.
  - type: input
    id: version
    attributes:
      label: openDJ version
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer
      placeholder: macOS aarch64, or Linux x86_64 (Ubuntu 24.04)
  - type: input
    id: graphics
    attributes:
      label: Graphics
      placeholder: e.g. Apple M2 (Metal), or NVIDIA GeForce RTX 3060 (Vulkan)
  - type: input
    id: audio
    attributes:
      label: Audio output
      placeholder: e.g. built-in speakers, or the controller's sound card
  - type: input
    id: controller
    attributes:
      label: Controllers, if any
      placeholder: e.g. a two-deck MIDI controller
  - type: textarea
    id: logs
    attributes:
      label: Logs or crash report
      description: >
        Help › Report a Problem fills in the version, computer, graphics,
        audio and controllers for you. In openDJ, open Help › Show Logs and
        Crash Reports, and drag
        opendj.log (and any crash-….txt) here.
