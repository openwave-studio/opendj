[package]
name = "opendj-separation"
description = "Stem separation in-process: Spleeter for instant stems, HTDemucs for high quality, on the GPU or CPU"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
demucs-core = { path = "../../third_party/demucs-core", features = ["ndarray", "wgpu", "fusion", "autotune"] }
burn = { version = "0.20.1", default-features = false, features = ["std", "ndarray", "simd", "wgpu", "fusion", "autotune", "cubecl"] }
burn-ndarray = { version = "0.22.1", features = ["multi-threads"] }
realfft = "3.5"
matrixmultiply = { version = "0.3", features = ["std"] }
safetensors = "0.8"
half = "2"
pollster = "1.0"

[target.'cfg(target_os = "macos")'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["metal"] }

# iPadOS: plain wgpu (WGSL on Metal); cubecl's MSL path is macOS only.
[target.'cfg(not(any(target_os = "macos", target_os = "ios")))'.dependencies]
burn = { version = "0.20.1", default-features = false, features = ["vulkan"] }

# The Neural Engine is reached only through Core ML (macOS and iPadOS).
[target.'cfg(target_vendor = "apple")'.dependencies]
objc2 = "0.6"
objc2-core-ml = { version = "0.3", default-features = false, features = ["std", "MLModel", "MLModelConfiguration", "MLMultiArray", "MLFeatureValue", "MLFeatureProvider", "MLDictionaryFeatureProvider", "MLModel_MLModelCompilation", "MLNeuralEngineComputeDevice", "MLAllComputeDevices", "MLComputeDeviceProtocol"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSError", "NSDictionary", "NSArray", "NSValue", "NSFileManager"] }
