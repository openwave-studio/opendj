[package]
name = "opendj-controllers"
description = "MIDI and HID controller support driven by Mixxx's own controller mappings"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opendj-control = { path = "../control" }
opendj-script = { path = "../script" }
base64 = "0.22"
# USB HID controllers (Native Instruments Traktor Kontrol and others). On
# Linux it uses hidraw through libudev; on macOS devices are opened shared,
# as Mixxx does, so another app can keep using them.
midir = "0.11"
roxmltree = "0.21"
rquickjs = { version = "0.14", features = ["classes", "properties"] }
serde_json = "1"

# QuickJS ships no ready-made bindings for iPadOS: make them at build time.
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.14", features = ["classes", "properties", "bindgen"] }

# iPadOS has no HID access for apps (no HIDDriverKit there): MIDI only.
[target.'cfg(not(target_os = "ios"))'.dependencies]
hidapi = { version = "2.6", default-features = false, features = ["linux-static-hidraw", "macos-shared-device"] }

# Registering with NI's host agent, which some NI keyboards need before
# their knobs work over HID (see src/ni_agent.rs).
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation-sys = "0.8"

[dev-dependencies]
opendj-engine = { path = "../engine" }
