<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openDJ Karaoke</title>
<style>
  :root { --lilac: #B69CFF; --text: #f5f5f7; --dim: #8e8e93; }
  html, body { margin: 0; height: 100%; background: #08080a; overflow: hidden; }
  body { font-family: Inter, "Helvetica Neue", Arial, sans-serif; color: var(--text);
    background: radial-gradient(circle at 50% 50%, color-mix(in srgb, var(--lilac) 10%, transparent) 0%, rgba(8,8,10,0) 70%), #08080a; }
  #backdrop { position: fixed; inset: 0; background-position: center; background-size: cover; opacity: .25; pointer-events: none; }
  #art-header { display: none; }
  body.artwork { background: #24282b; }
  body.artwork #backdrop { inset: -10%; opacity: .65; filter: blur(60px) brightness(.65); }
  body.artwork #art-header { position: fixed; display: flex; flex-direction: column; align-items: center; gap: 2.8vh; left: 10vw; top: 18vh; width: 30vw; text-align: center; }
  #art-header img { width: min(30vw, 44vh); height: min(30vw, 44vh); object-fit: cover; border-radius: 10px; }
  #art-header div { min-width: 0; width: min(30vw, 44vh); }
  #art-title, #art-artist { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; overflow-wrap: anywhere; }
  #art-title { font-size: max(20px, 3.6vh); font-weight: 700; }
  #art-artist { font-size: max(18px, 2.8vh); color: #ffffffaa; margin-top: .9vh; }
  body.artwork #top, body.artwork #lyrics { display: none; }
  body.artwork #main { inset: 10vh 8.5vw 10vh 51.5vw; padding: 0; text-align: left; }
  #art-viewport { display: none; }
  body.artwork:not(.message) #art-viewport { display: block; position: fixed; inset: 10vh 8.5vw 10vh 51.5vw; overflow: hidden; mask-image: linear-gradient(transparent, black 15%, black 80%, transparent); }
  #art-lines { position: absolute; top: 32vh; width: 100%; transition: transform 480ms ease-in-out; }
  .art-line { font-size: max(18px, 4vh); line-height: 1.3; font-weight: 750; color: #ffffff50; margin: 0 0 4vh; transition: color 420ms ease-in-out, filter 480ms ease-in-out; overflow-wrap: anywhere; }
  .art-line.active { color: #ffffff66; }
  @media (prefers-reduced-motion: reduce) { #art-lines, .art-line { transition: none; } }
  #top { position: fixed; left: 32px; top: 24px; right: 32px; font-size: max(14px, 2.8vh); font-weight: 600;
    color: rgba(142,142,147,.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #main { isolation: isolate; position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3.5vh; padding: 0 48px; text-align: center; }
  .line { font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  #before { font-size: 4.5vh; font-weight: 700; color: rgba(142,142,147,.45); min-height: 1.2em; }
  #dots { display: flex; gap: 2.5vh; height: 3vh; }
  #dots i { width: 3vh; height: 3vh; border-radius: 50%; background: var(--lilac); }
  #now { min-height: 1.3em; color: transparent; background-clip: text; -webkit-background-clip: text; }
  #next { color: rgba(245,245,247,.72); font-weight: 700; min-height: 1.2em; }
  #after { color: rgba(142,142,147,.6); font-weight: 700; min-height: 1.2em; }
  #message { display: none; }
  body.message #message { display: block; }
  body.message #lyrics { display: none; }
  #message h1 { font-size: 8vh; font-weight: 800; margin: 0 0 3vh; }
  #message p { font-size: 4vh; font-weight: 600; color: var(--dim); margin: 0; }
  #message p.lit { color: var(--lilac); }
  #lyrics { display: contents; }
</style>
</head>
<body class="message">
<div id="backdrop"></div>
<div id="top"></div>
<div id="art-header"><img id="art-cover" alt=""><div><div id="art-title"></div><div id="art-artist"></div></div></div>
<div id="art-viewport"><div id="art-lines"></div></div>
<div id="main">
  <div id="message"><h1>openDJ Karaoke</h1><p>Lyrics show here for the track playing.</p></div>
  <div id="lyrics">
    <div id="before" class="line"></div>
    <div id="dots"></div>
    <div id="now" class="line"></div>
    <div id="next" class="line"></div>
    <div id="after" class="line"></div>
  </div>
</div>
<script>
  // The same screen as openDJ's karaoke window: the line being sung, its
  // word filling as it is sung, or else the next line with a count-in.
  const LINGER = 1.5, COUNT_IN = 4;
  let now = {}, lines = [], linesId = null, base = 0, baseWall = 0;
  const $ = id => document.getElementById(id);
  const sung = l => l.start !== null && l.text.trim() !== '';

  function lineAt(t) {
    let found = -1;
    for (let i = 0; i < lines.length; i++) {
      const s = lines[i].start;
      if (s === null || s > t) break;
      found = i;
    }
    return found;
  }
  function nextSung(from) {
    for (let i = from; i < lines.length; i++) if (sung(lines[i])) return i;
    return -1;
  }
  function fill(line, t) {
    const w = line.words;
    let k = -1;
    for (let i = 0; i < w.length; i++) if (w[i][0] <= t) k = i;
    const join = ws => ws.map(x => x[2]).join('');
    if (k < 0) return { sung: '', word: '', part: 0, rest: line.text.trim() };
    if (k === w.length - 1 && t >= w[k][1]) return { sung: join(w).trim(), word: '', part: 0, rest: '' };
    const text = w[k][2], word = text.trimEnd();
    const length = w[k][1] - w[k][0];
    return {
      sung: join(w.slice(0, k)).trimStart(),
      word: word.trimStart(),
      part: length > 0 ? Math.min(1, Math.max(0, (t - w[k][0]) / length)) : 1,
      rest: (text.slice(word.length) + join(w.slice(k + 1))).trimEnd(),
    };
  }
  function screen(t, beat) {
    const s = { focus: -1, before: '', sung: '', word: '', part: 0, rest: '', next: '', after: '', count: 0 };
    const current = lineAt(t);
    let singing = -1;
    if (current >= 0 && sung(lines[current])) {
      const w = lines[current].words;
      const end = w.length ? w[w.length - 1][1] : t;
      const until = current + 1 < lines.length ? lines[current + 1].start : null;
      if (t < end + LINGER || (until !== null && until - t < LINGER)) singing = current;
    }
    const focus = singing >= 0 ? singing : nextSung(current + 1);
    const prevSung = upTo => { for (let j = upTo; j >= 0; j--) if (sung(lines[j])) return lines[j].text.trim(); return ''; };
    if (focus < 0) { s.before = prevSung(current); for (let i = current; i >= 0; i--) if (sung(lines[i])) { s.focus = i; break; } return s; }
    s.focus = focus;
    s.before = prevSung(focus - 1);
    const next = nextSung(focus + 1);
    if (next >= 0) {
      s.next = lines[next].text.trim();
      const after = nextSung(next + 1);
      if (after >= 0) s.after = lines[after].text.trim();
    }
    if (singing >= 0) {
      Object.assign(s, fill(lines[focus], t));
    } else {
      s.rest = lines[focus].text.trim();
      const toGo = lines[focus].start - t, beats = toGo / Math.max(beat, 0.1);
      if (toGo > 0 && beats <= COUNT_IN) s.count = Math.ceil(beats);
    }
    return s;
  }

  const measure = document.createElement('canvas').getContext('2d');
  let shown = '', artworkId = null, artworkFocus = -1, artworkSize = '';
  function drawArtwork(s, t) {
    const focus = s.focus;
    const column = $('art-lines');
    if (artworkId !== linesId) {
      column.replaceChildren();
      lines.forEach((line, i) => {
        if (!sung(line)) return;
        const row = document.createElement('div');
        row.className = 'art-line';
        row.dataset.line = i;
        // Keep every word in the same text flow. Only its paint changes;
        // no shorter, independently wrapped text is overlaid on the line.
        if (line.words.length) {
          line.words.forEach((word, index) => {
            const span = document.createElement('span');
            let text = word[2];
            if (index === 0) text = text.trimStart();
            if (index === line.words.length - 1) text = text.trimEnd();
            span.textContent = text;
            row.appendChild(span);
          });
        } else {
          row.textContent = line.text.trim();
        }
        column.appendChild(row);
      });
      artworkId = linesId;
      artworkFocus = -1;
    }
    const moved = artworkFocus !== focus;
    if (moved) {
      artworkFocus = focus;
      for (const row of column.children) {
        row.classList.toggle('active', Number(row.dataset.line) === focus);
        for (const word of row.children) word.style.color = '';
      }
    }
    const row = column.querySelector('.active');
    if (row) {
      const words = lines[focus].words;
      for (let i = 0; i < words.length; i++) {
        const [start, end] = words[i];
        const part = t < start ? 0 : end <= start ? 1 : Math.max(0, Math.min(1, (t - start) / (end - start)));
        // Smoothly reveal the current word over its own timed duration.
        row.children[i].style.color = 'rgba(255,255,255,' + (0.4 + 0.6 * part) + ')';
      }
    }
    const viewport = $('art-viewport');
    const size = viewport.clientWidth + ':' + viewport.clientHeight;
    if (!moved && artworkSize === size) return;
    artworkSize = size;
    const offset = row ? row.offsetTop : 0;
    const top = column.offsetTop;
    for (const line of column.children) {
      const y = top + line.offsetTop - offset;
      const distance = Math.min(y, viewport.clientHeight - y - line.offsetHeight);
      const edge = Math.max(0, Math.min(1, 1 - distance / Math.max(1, viewport.clientHeight * 0.18)));
      const filter = 'blur(' + (edge * 4).toFixed(2) + 'px)';
      if (line.style.filter !== filter) line.style.filter = filter;
    }
    const transform = 'translateY(-' + offset + 'px)';
    if (column.style.transform !== transform) column.style.transform = transform;
  }
  function draw() {
    requestAnimationFrame(draw);
    const message = now.state !== 3;
    document.body.classList.toggle('message', message);
    $('top').textContent = now.state > 0 ? (now.artist ? now.title + '  ·  ' + now.artist : now.title) : '';
    if (message) {
      const m = now.state === 1 ? 'No lyrics for this track' : now.state === 2
        ? "These lyrics aren't timed, so they can't follow the song." : 'Lyrics show here for the track playing.';
      $('message').querySelector('h1').textContent = now.state > 0 ? now.title : 'openDJ Karaoke';
      const p = $('message').querySelector('p');
      p.textContent = m;
      p.classList.toggle('lit', now.state === 1);
      return;
    }
    if (linesId !== now.id) return;
    const t = base + (now.playing ? (performance.now() - baseWall) / 1000 : 0);
    const s = screen(t, now.bpm > 0 ? 60 / now.bpm : 0.5);
    if (now.style === 1) { drawArtwork(s, t); return; }
    const key = JSON.stringify([s, now.style]);
    if (key === shown) return;
    shown = key;
    const text = s.focus >= 0 && (s.sung + s.word + s.rest) ? lines[s.focus].text.trim() : '';
    const letters = text.length;
    const big = 'min(10vh, calc(170vw / ' + Math.max(letters, 14) + '))';
    const line = $('now');
    line.style.fontSize = big;
    $('next').style.fontSize = 'calc(' + big + ' * 0.62)';
    $('after').style.fontSize = 'calc(' + big + ' * 0.5)';
    line.textContent = text;
    measure.font = getComputedStyle(line).font;
    const prefix = measure.measureText(s.sung).width;
    const throughWord = measure.measureText(s.sung + s.word).width;
    const width = measure.measureText(text).width;
    const p = (width ? 100 * (prefix + (throughWord - prefix) * s.part) / width : 0) + '%';
    line.style.backgroundImage = 'linear-gradient(90deg, var(--lilac) ' + p + ', var(--unsung, var(--text)) ' + p + ')';
    $('before').textContent = s.before;
    $('next').textContent = s.next;
    $('after').textContent = s.after;
    $('dots').innerHTML = '<i></i>'.repeat(s.count);
  }

  async function poll() {
    // Serialize updates so a slow response cannot overwrite a newer track or
    // seek position. Bound a stalled request so polling always recovers.
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 5000);
    try {
      const r = await fetch('/karaoke.json', { cache: 'no-store', signal: controller.signal });
      const j = await r.json();
      now = j;
      document.documentElement.style.setProperty('--lilac', /^#[0-9a-f]{6}$/i.test(j.color) ? j.color : '#b69cff');
      document.documentElement.style.setProperty('--unsung', j.color === '#ffffff' ? '#ffffff66' : '#f5f5f7');
      document.body.classList.toggle('artwork', j.style === 1);
      $('art-title').textContent = j.state > 0 ? j.title || '' : '';
      $('art-artist').textContent = j.state > 0 ? j.artist || '' : '';
      const cover = typeof j.cover === 'string' && j.cover.startsWith('/karaoke/cover?track=') ? j.cover : '';
      $('art-cover').hidden = !cover || !j.state;
      if (cover && $('art-cover').getAttribute('src') !== cover) $('art-cover').src = cover;
      $('backdrop').style.backgroundImage = j.style === 1 && typeof j.cover === 'string' && j.cover.startsWith('/karaoke/cover?track=') ? 'url("' + j.cover + '")' : 'none';
      base = j.t || 0;
      baseWall = performance.now();
      if (j.state === 3 && j.id !== null && j.id !== undefined && j.id !== linesId) {
        const l = await (await fetch('/karaoke/lines.json', { cache: 'no-store', signal: controller.signal })).json();
        if (l.id === j.id) { lines = l.lines || []; linesId = l.id; shown = ''; }
      }
    } catch (e) { /* openDJ closed or the karaoke screen was closed */ }
    finally {
      clearTimeout(timeout);
      setTimeout(poll, 250);
    }
  }
  poll();
  requestAnimationFrame(draw);
</script>
</body>
</html>
