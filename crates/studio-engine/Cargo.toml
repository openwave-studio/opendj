[package]
name = "opendj-studio-engine"
description = "openDJ Studio's engine: tracks, clips, scenes, devices and Live sets, with no audio device or UI, for the Studio app and openDJ's Session deck"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["link"]
link = ["dep:rusty_link"]

[dependencies]
# The Groove Box kits and samples, and the filters. Without Whisper.
opendj-engine = { path = "../engine", default-features = false }
# Runs plug-ins in helper processes (the client side only).
opendj-plugin-host = { path = "../plugin-host", default-features = false }
rtrb = "0.4"
# Ableton Link (cmake and bindgen at build time): the Studio app wants it;
# openDJ's Session follows the master deck instead and leaves it out.
rusty_link = { version = "0.4", optional = true }
flate2 = "1"
roxmltree = "0.21"
realfft = "3.5"
# Building blocks for new devices (filters, oscillators, oversampling),
# used inside our own devices rather than as the engine. Without its file
# loading and FFT extras.
fundsp = { version = "0.23", default-features = false, features = ["std"] }
# The Session's own real-time thread in openDJ (already in the tree through
# cpal).
audio_thread_priority = { version = "0.35", default-features = false }
# The studio's own set file: JSON, with plug-in sounds as base64.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
base64 = "0.22"
